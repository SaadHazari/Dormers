name: CI

on:
  push:
    branches: [main, Production]
  pull_request:
    branches: [main]

# Cancel any in-flight runs for the same branch when a newer commit lands —
# Netlify is the deploy gate; CI is the read-only verification ahead of it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest

    # Matches Netlify's NODE_VERSION in netlify.toml. Bumping requires bumping
    # both in lockstep so CI and the deploy environment stay aligned.
    env:
      NODE_VERSION: '20'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # next build wants these envs to be present even though we're not
          # actually hitting Supabase from CI. Dummy values keep the build
          # from failing on top-level env reads in adapter modules.
          NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
          # The app reads PUBLISHABLE_KEY (not the old ANON_KEY name); also keeps
          # the Phase 8 boot env-validation's critical-key check satisfied.
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-dummy-publishable-key
          SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
